name: Fix Student Portal Links

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace old Student Portal URL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "https://drsandaruwanperera.github.io/answersheet/"
          new = "https://drsandaruwanperera.lk/studentportal/"

          skip_dirs = {".git", "node_modules"}
          changed = []

          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if old in text:
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  changed.append(str(path))

          print("Updated files:")
          for item in changed:
              print(item)
          print(f"Total: {len(changed)}")
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No old Student Portal links found."
            exit 0
          fi
          git commit -m "Update Student Portal links"
          git push
