name: Update Student Portal Links

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update portal URLs
        run: |
          OLD='https://drsandaruwanperera.github.io/answersheet/'
          NEW='https://drsandaruwanperera.lk/studentportal/'
          files=$(git grep -l "$OLD" || true)
          if [ -n "$files" ]; then
            while IFS= read -r file; do
              sed -i "s|$OLD|$NEW|g" "$file"
            done <<< "$files"
          fi

      - name: Commit updated links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Student Portal links" || exit 0
          git push
